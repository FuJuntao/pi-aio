name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint / Typecheck / Format / Build / Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        # Runs before setup-node: its `cache: pnpm` invokes `pnpm` to resolve the
        # store path during its own step, so pnpm must be on PATH first. corepack
        # can't fill this role here since it needs Node first (chicken-and-egg).
        # pnpm version is read from the `packageManager` field in package.json.
        uses: pnpm/action-setup@v5

      - name: Set up Node.js (from .nvmrc)
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
